<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>taktflow 控制台</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6.5' fill='%2328231f'/%3E%3Crect x='7' y='9' width='2.6' height='10' rx='1.3' fill='%23c9c2b8'/%3E%3Crect x='12.7' y='9' width='2.6' height='10' rx='1.3' fill='%23c9c2b8'/%3E%3Crect x='18.4' y='6' width='2.6' height='16' rx='1.3' fill='%23e8743b'/%3E%3C/svg%3E" />
    <script>
      // 首帧前确定主题，避免闪烁
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var t = q === 'dark' || q === 'light' ? q : localStorage.getItem('takt.theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
